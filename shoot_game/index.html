  <body style="position: fixed; overflow: hidden">
<div id="joinGate" role="dialog" aria-modal="true">
  <div class="join-card">
    <p class="join-eyebrow">PRIVATE ZOMBIE ARENA</p>

    <h1>Join the game</h1>

    <p class="join-intro">
      Enter your participant details to join the private match.
    </p>

    <form id="joinForm" hidden>
      <label for="participantId">Participant ID</label>
      <input
        id="participantId"
        type="text"
        maxlength="64"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        placeholder="e.g. P001"
        required
      />

      <label for="accessCode">Access Code</label>
      <input
        id="accessCode"
        type="password"
        maxlength="128"
        autocomplete="off"
        placeholder="Enter your access code"
        required
      />

      <label for="playerName">Your name</label>
      <input
        id="playerName"
        maxlength="24"
        autocomplete="name"
        placeholder="Enter your name"
        required
      />

      <button type="submit">Join game</button>
    </form>

    <p id="joinStatus" class="join-status">
      Connecting to the private game server…
    </p>
  </div>
</div>
